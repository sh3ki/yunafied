name: Build Android Release APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install helper packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Install Android SDK cmdline-tools and packages
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;23.1.7779620" "cmake;3.22.1"

      - name: Install JS dependencies (mobile-app)
        working-directory: mobile-app
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Show Java and SDK info
        run: |
          java -version
          ls -la "$ANDROID_SDK_ROOT"

      - name: Build release APK
        working-directory: mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-parallel --no-build-cache --console=plain assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: mobile-app/android/app/build/outputs/**/*.apk
